stages:
  - build
  - deploy

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  tags:
    - vps-BE-runner
  image: docker:29.1
  retry:
    max: 2
    when:
      - always
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL -t $IMAGE:$TAG -t $IMAGE:latest .
    - docker push $IMAGE:$TAG
    - docker push $IMAGE:latest

deploy:
  stage: deploy
  tags:
    - vps-BE-runner
  image: alpine:latest
  retry:
    max: 2
    when:
      - always
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $VPS_USER@$VPS_HOST << EOF
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker pull $IMAGE:$TAG
        docker stop dashboard_fe || true
        docker rm dashboard_fe || true
        docker run -d \
          --name dashboard_fe \
          --restart unless-stopped \
          -p 3000:3000 \
          $IMAGE:$TAG
        docker image prune -f
      EOF
  only:
    - dev
